<div class="col-6">
    <div class="mb-3">
        <form>

            <div class="form-group pt-4">
                <label for="num1">Numero 1</label>
                <input 
                    [(ngModel)]="num1" 
                    type="text" 
                    name="num1" 
                    class="form-control" 
                    id="num1" 
                    placeholder="Ingresa numero 1">
            </div>

            <div class="form-group pt-4">
                <label for="num2">Numero 2</label>
                <input 
                    [(ngModel)]="num2" 
                    type="text" 
                    name="num2" 
                    class="form-control" 
                    id="num2" 
                    placeholder="Ingresa numero 2">
            </div>

            <br>

            <h4>Selecciona una operación:</h4>

            <!-- SUMAR -->
            <div class="form-check">
                <input 
                    class="form-check-input"
                    type="radio"
                    name="operacion"
                    value="sumar"
                    [(ngModel)]="operacion"
                    id="sumar">

                <label class="form-check-label" for="sumar">
                    Sumar
                </label>
            </div>

            <!-- DIVIDIR -->
            <div class="form-check">
                <input 
                    class="form-check-input"
                    type="radio"
                    name="operacion"
                    value="dividir"
                    [(ngModel)]="operacion"
                    id="dividir">

                <label class="form-check-label" for="dividir">
                    Dividir
                </label>
            </div>

            <!-- MULTIPLICAR -->
            <div class="form-check">
                <input 
                    class="form-check-input"
                    type="radio"
                    name="operacion"
                    value="multiplicar"
                    [(ngModel)]="operacion"
                    id="multiplicar">

                <label class="form-check-label" for="multiplicar">
                    Multiplicar
                </label>
            </div>

            <!-- RESTAR -->
            <div class="form-check">
                <input 
                    class="form-check-input"
                    type="radio"
                    name="operacion"
                    value="restar"
                    [(ngModel)]="operacion"
                    id="restar">

                <label class="form-check-label" for="restar">
                    Restar
                </label>
            </div>

            <br>

            <!-- BOTÓN CALCULAR -->
            <button 
                (click)="calcular()"
                type="button"
                class="btn btn-success">
                Calcular
            </button>

        </form>
    </div>
</div>

<div class="col-6">
    <h2>Resultado: {{ resultado }}</h2>
</div>

<h2>Distancia entre dos puntos</h2>

<div class="row">

    <div class="col-6">

        <h4>Punto 1</h4>

        <div class="form-group pt-2">
            <label for="x1">X1</label>

            <input
                [(ngModel)]="x1"
                type="number"
                name="x1"
                class="form-control"
                id="x1"
                placeholder="Ingresa X1">
        </div>

        <div class="form-group pt-2">
            <label for="y1">Y1</label>

            <input
                [(ngModel)]="y1"
                type="number"
                name="y1"
                class="form-control"
                id="y1"
                placeholder="Ingresa Y1">
        </div>

    </div>


    <div class="col-6">

        <h4>Punto 2</h4>

        <div class="form-group pt-2">
            <label for="x2">X2</label>

            <input
                [(ngModel)]="x2"
                type="number"
                name="x2"
                class="form-control"
                id="x2"
                placeholder="Ingresa X2">
        </div>

        <div class="form-group pt-2">
            <label for="y2">Y2</label>

            <input
                [(ngModel)]="y2"
                type="number"
                name="y2"
                class="form-control"
                id="y2"
                placeholder="Ingresa Y2">
        </div>

    </div>

</div>

<br>

<button
    (click)="calcularDistancia()"
    type="button"
    class="btn btn-primary">

    Calcular distancia

</button>

<br>
<br>

<h3>
    Distancia: {{ resultado }}
</h3>
